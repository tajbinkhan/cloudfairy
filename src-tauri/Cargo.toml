[package]
name = "cloudfairy"
version = "0.1.1"
description = "Desktop app (GUI) for Cloudflare quick tunnels: share localhost with a public trycloudflare.com link"
authors = ["Tajbin Khan"]
homepage = "https://tajbinkhan.github.io/cloudfairy/"
repository = "https://github.com/tajbinkhan/cloudfairy"
readme = "../README.md"
keywords = ["cloudflare", "tunnel", "cloudflared", "localhost", "tauri"]
categories = ["development-tools", "network-programming", "gui"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "net", "fs", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
which = "8"
tauri-plugin-updater = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
