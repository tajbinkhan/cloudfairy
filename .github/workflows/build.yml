name: Build

# - Every push to main and every pull request: lint, test, and build installers for
#   Linux, Windows and macOS. Installers are attached to the run as downloadable artifacts.
# - Pushing a tag like v0.1.0: same, plus a draft GitHub Release with all installers attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The end-to-end tunnel test is #[ignore]d: it needs Cloudflare's network.
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    permissions:
      contents: write # create the draft release on tag pushes
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low so the .deb/.AppImage run on older distros.
          - name: linux-x64
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
          - name: windows-x64
            os: windows-latest
            rust-targets: ""
            args: ""
          # One app that runs natively on both Apple Silicon and Intel Macs.
          - name: macos-universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # A release without signed installers and latest.json would cut users off from updates.
      - name: Require the update signing key for releases
        if: github.ref_type == 'tag' && env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before tagging a release."
          exit 1

      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install Tauri CLI
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers so the in-app updater accepts them. The matching public key
          # is plugins.updater.pubkey in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Without the signing key (pull requests from forks) build unsigned installers instead.
          args: ${{ matrix.args }} ${{ env.HAS_SIGNING_KEY != 'true' && '--config src-tauri/tauri.unsigned.conf.json' || '' }}
          uploadWorkflowArtifacts: true
          # Only tag pushes publish a (draft) release; other runs just keep the artifacts.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Cloudfairy ${{ github.ref_name }}
          releaseBody: Installers for Windows, macOS (universal) and Linux are attached below.
          releaseDraft: true
          # latest.json is what installed copies read to find updates.
          includeUpdaterJson: true
