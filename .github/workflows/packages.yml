name: Packages

# Publishes a release to winget, the Homebrew tap and the AUR once the release is published.
# A job is skipped until its secrets are set. packaging/README.md lists the one-time setup.
#
# A release whose tag predates this workflow doesn't trigger it. Run it by hand from the
# Actions tab with that version instead.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 0.1.7
        required: true

permissions:
  contents: read

jobs:
  render:
    # Manual runs must use the workflow from main, since the jobs receive secrets.
    if: >-
      ${{ !github.event.release.prerelease &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      winget: ${{ secrets.WINGET_TOKEN != '' }}
      homebrew: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      aur: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        env:
          RAW: ${{ inputs.version || github.event.release.tag_name }}
        # Later steps and jobs put the version into commands, so accept only plain X.Y.Z.
        run: |
          version="${RAW#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW' isn't a version like 0.1.7"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash packaging/render.sh "$VERSION" out

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out

  winget:
    needs: render
    if: needs.render.outputs.winget == 'true'
    runs-on: ubuntu-latest
    steps:
      # Opens a pull request on microsoft/winget-pkgs from the token owner's fork. It copies
      # the previous version's manifests, so the first version has to be submitted by hand.
      # Third-party actions that receive secrets are pinned to a commit, not a movable tag.
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: TajbinKhan.Cloudfairy
          version: ${{ needs.render.outputs.version }}
          release-tag: v${{ needs.render.outputs.version }}
          installers-regex: '_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  homebrew:
    needs: render
    if: needs.render.outputs.homebrew == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: out

      - uses: actions/checkout@v7
        with:
          repository: tajbinkhan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit the cask
        working-directory: tap
        env:
          VERSION: ${{ needs.render.outputs.version }}
        run: |
          mkdir -p Casks
          cp ../out/homebrew/Casks/cloudfairy.rb Casks/cloudfairy.rb
          git add Casks/cloudfairy.rb
          if git diff --cached --quiet; then
            echo "The cask already has $VERSION."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "cloudfairy $VERSION"
          git push

  aur:
    needs: render
    if: needs.render.outputs.aur == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: out

      # Generates .SRCINFO and pushes to the AUR. The first push creates the package.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: cloudfairy-bin
          pkgbuild: out/aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: cloudfairy-bin ${{ needs.render.outputs.version }}
