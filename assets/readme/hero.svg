<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Cloudfairy</title>
  <desc id="desc">Cloudfairy is a desktop app for Cloudflare quick tunnels. Type a port, get a public link: localhost:3000 becomes https://maple-ranges-quietly-orbit.trycloudflare.com through cloudflared.</desc>

  <defs>
    <!-- The app's own accent gradient (ui/styles.css) -->
    <linearGradient id="fairy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e8467c"/>
    </linearGradient>
    <linearGradient id="fairy-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e8467c"/>
    </linearGradient>
    <linearGradient id="fairy-line" gradientUnits="userSpaceOnUse" x1="314" y1="0" x2="410" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e8467c"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
    <path id="cloud" d="M330 700h390c75 0 132-55 132-126 0-68-52-121-120-126-14-98-96-170-196-170-80 0-150 47-181 117-8-1-16-2-25-2-86 0-150 64-150 154s64 153 150 153z"/>
    <path id="spark" d="M0-62l22 40 40 22-40 22-22 40-22-40-40-22 40-22z"/>
  </defs>

  <!-- Background: the app's dark surface -->
  <rect width="1200" height="440" rx="24" fill="#141312"/>

  <!-- Faint oversized cloud from the app icon -->
  <g clip-path="url(#frame)">
  <g id="backdrop" opacity="0.13" transform="translate(690 -150) scale(0.62)">
    <use href="#cloud" fill="url(#fairy)"/>
  </g>
  <g fill="url(#fairy)">
    <use href="#spark" transform="translate(1110 70) scale(0.42)"/>
    <use href="#spark" transform="translate(1062 128) scale(0.22)" opacity="0.7"/>
  </g>
  </g>

  <!-- Title block -->
  <g id="title-block">
    <g transform="translate(64 50) scale(0.0625)">
      <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#fairy)"/>
      <use href="#cloud" fill="#fff"/>
      <path fill="#fff" d="M770 168l22 62 62 22-62 22-22 62-22-62-62-22 62-22z"/>
      <path fill="none" stroke="#e8467c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" d="M430 570h170m-60-60 60 60-60 60"/>
    </g>
    <text x="138" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.5" fill="#a39d95">DESKTOP APP · CLOUDFLARE QUICK TUNNELS</text>

    <text x="60" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="88" font-weight="700" letter-spacing="-2" fill="#f1eeea">Cloudfairy</text>
    <text x="64" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="34" font-weight="600" fill="#f1eeea">Type a port. <tspan fill="url(#fairy-h)">Get a public link.</tspan></text>
  </g>

  <!-- The transformation the app performs -->
  <g id="project-proof" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="306" font-size="18" fill="#a39d95">on your computer</text>
    <rect x="64" y="318" width="236" height="58" rx="12" fill="#1d1c1a" stroke="#3a3633" stroke-width="1.5"/>
    <text x="88" y="355" font-size="22" fill="#f1eeea">localhost:3000</text>

    <!-- cloudflared hop -->
    <text x="364" y="404" font-size="18" fill="#a39d95" text-anchor="middle">cloudflared</text>
    <path d="M314 347h96" stroke="url(#fairy-line)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M396 333l16 14-16 14" stroke="#e8467c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <text x="430" y="306" font-size="18" fill="#a39d95">anyone can open</text>
    <rect x="428" y="318" width="708" height="58" rx="12" fill="#1d1c1a" stroke="#2c6e47" stroke-width="1.5"/>
    <circle cx="456" cy="347" r="11" fill="#3ccf7a" opacity="0.22"/>
    <circle cx="456" cy="347" r="6" fill="#3ccf7a"/>
    <text x="478" y="354" font-size="20" fill="#f1eeea">https://maple-ranges-quietly-orbit<tspan fill="#a39d95">.trycloudflare.com</tspan></text>
  </g>

  <text x="1136" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#3ccf7a" text-anchor="end">Live</text>
</svg>
